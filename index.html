<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело №07 — Тёмный протокол</title><style>
*{box-sizing:border-box}body{margin:0;background:#070c15;color:#eee7d9;font:15px system-ui,Arial}button,input{font:inherit}button{cursor:pointer;border:1px solid #8a7046;background:#172332;color:#f6e9cf;border-radius:9px;padding:10px 13px}button:hover{background:#364358}button:disabled{opacity:.4}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(34px,6vw,65px);margin:4px 0;color:#e4bb70}h2{color:#e4bb70;margin:0 0 12px}#app{max-width:1120px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0 12px}.muted{color:#b5b9c1;font-size:13px}.panel{border:1px solid #826b49;background:#101b2aee;border-radius:14px;padding:18px;box-shadow:0 16px 40px #0009}.hero{min-height:70vh;background:linear-gradient(90deg,#060d19ed,#060d1933),url('cover.jpg') center/cover;display:flex;align-items:center;padding:clamp(18px,6vw,65px);border:1px solid #735d3c;border-radius:16px}.hero p{max-width:460px;line-height:1.7}.gold{background:#d8ac60;color:#10151e;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}.stage{position:relative;aspect-ratio:16/9;background:#0d1624;border:1px solid #91724d;border-radius:12px;overflow:hidden}.stage img{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.77) saturate(1.12)}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 75%,#040a13c7)}.actor{position:absolute;width:26px;height:37px;border-radius:11px 11px 7px 7px;background:linear-gradient(90deg,#263c55,#b7a17b 40%,#243346 42%);border:2px solid #edc98d;box-shadow:0 0 14px #d8ac60;transform:translate(-50%,-50%);z-index:3;transition:left .06s linear,top .06s linear}.actor:before{content:"";position:absolute;top:-12px;left:5px;width:13px;height:13px;border-radius:50%;background:#d7b08d}.hot{position:absolute;z-index:2;transform:translate(-50%,-50%);border:1px solid #edc98d;background:#07121bbd;color:#f5dba9;padding:5px 8px;border-radius:8px;font-size:12px;box-shadow:0 0 15px #dfaa4e88}.hot.near{background:#916d34;color:white}.bar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.bar button{flex:1;min-width:100px}.sidebar{display:flex;flex-direction:column;gap:12px}.sidebar .panel{padding:13px}.items{font-size:13px;line-height:1.65}.controls{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px;justify-content:center;margin:10px 0}.controls button{padding:4px;touch-action:none;user-select:none}.controls button:first-child{grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.overlay{position:fixed;inset:0;background:#02060cdd;z-index:10;display:flex;justify-content:center;align-items:center;padding:15px;overflow:auto}.modal{width:min(700px,100%);max-height:94vh;overflow:auto}.close{float:right}.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.suspects button{padding:5px}.suspects img{width:100%;height:150px;object-fit:cover;border-radius:6px}.portrait{width:120px;height:155px;object-fit:cover;float:left;margin:0 15px 8px 0;border-radius:9px}.chat{height:160px;overflow:auto;background:#09121e;padding:12px;border-radius:8px;margin:10px 0}.msg{margin:8px 0;line-height:1.5}.msg b{color:#dcb66c}.inputrow{display:flex;gap:8px}.inputrow input{flex:1;min-width:0;background:#08111d;border:1px solid #796341;color:white;border-radius:8px;padding:10px}.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.evidence label{padding:9px;border:1px solid #786344;border-radius:8px;font-size:13px}.status{color:#dfc087}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172b37;border:1px solid #d9b16a;border-radius:10px;padding:12px;z-index:30;display:none;max-width:90vw}.sceneinfo{position:absolute;left:12px;top:12px;z-index:3;background:#08111bbb;padding:8px;border-radius:8px}.end{text-align:center;padding:35px}.end h1{font-size:50px}.hint{font-size:12px;color:#b8c4cc} @media(max-width:750px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.suspects img{height:100px}.stage{aspect-ratio:4/3}.hot{font-size:10px;padding:4px}.hero{min-height:65vh}.portrait{width:90px;height:115px}} 
</style></head><body><div id="app"></div><div id="toast"></div><script>
const app=document.getElementById('app');let state,modal='',music=null,osc=[],audio=null,keys={};
const rooms={
office:{name:'Кабинет директора',img:'office.jpg',objects:[['Стол',27,76,'desk'],['Шкаф',80,34,'shelf'],['Сейф',88,72,'safe'],['Картина',50,25,'painting']]},
lab:{name:'Лаборатория',img:'lab.jpg',objects:[['Терминал',70,65,'terminal'],['Стол учёного',27,70,'labdesk'],['Шкафчик',42,35,'locker'],['Образец',86,35,'sample']]},
server:{name:'Серверная',img:'server.jpg',objects:[['Сервер',20,37,'rack'],['Монитор',68,63,'monitor'],['Панель',89,35,'panel'],['Ящик',37,78,'box']]}};
const names={director:'Алексей Соколов — директор',scientist:'Мария Волкова — учёная',engineer:'Даниил Кравцов — инженер'};
const ev={note:'Записка: «Дата запуска — 14.08»',key:'Ключ от серверной',log:'Журнал доступа: 23:47 — карта директора',usb:'USB с удалённой командой',memo:'Секретный приказ директора',photo:'Снимок отключённой камеры',badge:'Пропуск лаборатории',trace:'Следы доступа к серверу'};
function reset(){state={screen:'home',room:'office',x:48,y:84,items:[],seen:[],opened:false,visited:{},dialog:{},questions:0,ended:false};modal='';render()}
function has(id){return state.items.includes(id)}function add(id){if(!has(id)){state.items.push(id);toast('Новая улика: '+ev[id]);}render()}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',3000)}
function playClick(){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=540;g.gain.value=.025;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.07)}
function toggleMusic(){if(audio){osc.forEach(o=>o.stop());osc=[];audio.close();audio=null;toast('Музыка выключена');return}try{audio=new (window.AudioContext||window.webkitAudioContext)();[110,164.81,220].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=i===0?.022:.009;o.connect(g).connect(audio.destination);o.start();osc.push(o)});toast('Атмосферный звук включён')}catch(e){toast('Браузер не поддерживает звук')}}
function start(){state.screen='play';render()}function room(r){state.room=r;state.x=48;state.y=83;render()}
function move(dx,dy){if(state.screen!=='play'||modal)return;state.x=Math.max(7,Math.min(93,state.x+dx));state.y=Math.max(18,Math.min(89,state.y+dy));let p=document.querySelector('.actor');if(p){p.style.left=state.x+'%';p.style.top=state.y+'%'}}
function interact(id){let o=rooms[state.room].objects.find(a=>a[3]===id);if(!o)return;let dist=Math.hypot((state.x-o[1])*.8,(state.y-o[2])*1.1);if(dist>36){toast('Подойди ближе к предмету с помощью WASD или стрелок');return}playClick();inspect(id)}
function inspect(id){
let title='',body='';
switch(id){
case'desk':title='Стол директора';body='В верхнем ящике — счета и договоры. В нижнем ящике лежит сложенная записка.';body+=has('note')?' Записка уже в журнале.':'<p><button onclick="add(\'note\');show(\'desk\')">Взять записку</button></p>';break;
case'shelf':title='Книжный шкаф';body='Среди папок лежит небольшой ключ с маркировкой SERVER.'+(has('key')?'':'<p><button onclick="add(\'key\');show(\'shelf\')">Забрать ключ</button></p>');break;
case'painting':title='Картина';body='За рамой обнаружена надпись: «Четыре цифры. День и месяц запуска проекта». Возможно, это код от сейфа.';break;
case'safe':title='Сейф';body=state.opened?'Сейф открыт. Внутри обнаружен секретный приказ.':`Введи четырёхзначный код. <p class="inputrow"><input id="code" maxlength="4" inputmode="numeric" placeholder="0000"><button onclick="unlock()">Открыть</button></p><span class="hint">Подсказки есть в кабинете. Не пытайся угадать случайно.</span>`;break;
case'labdesk':title='Стол учёного';body='В лабораторном журнале — запись о пропаже экспериментального образца. На столе лежит пропуск.'+(has('badge')?'':'<p><button onclick="add(\'badge\');show(\'labdesk\')">Взять пропуск</button></p>');break;
case'terminal':title='Терминал лаборатории';body='Запись: «23:45 — система перешла в режим ручного управления. Требуется подтверждение администратора». Директор имел права администратора.';break;
case'locker':title='Шкафчик';body='В шкафчике — защитные очки и журнал экспериментов. Ничего подозрительного.';break;
case'sample':title='Образец';body='Контейнер пуст. Исчезнувший учёный, возможно, успел перенести экспериментальные данные.';break;
case'rack':title='Серверная стойка';body='Один из портов недавно использовался. На полу — следы вскрытия.'+(has('trace')?'':'<p><button onclick="add(\'trace\');show(\'rack\')">Зафиксировать следы</button></p>');break;
case'monitor':title='Журнал сервера';body=has('key')?'Сервер разблокирован ключом доступа. Последняя команда отправлена с карты директора в 23:47.': 'Для просмотра журналов требуется ключ от серверной. Найди его в другой комнате.';if(has('key')&&!has('log'))body+='<p><button onclick="add(\'log\');show(\'monitor\')">Сохранить журнал</button></p>';break;
case'panel':title='Панель видеонаблюдения';body='Камеры были отключены на семь минут. Сохранился один повреждённый кадр.'+(has('photo')?'':'<p><button onclick="add(\'photo\');show(\'panel\')">Сохранить кадр</button></p>');break;
case'box':title='Технический ящик';body='Внутри USB-накопитель. На нём записана команда на удаление архива.'+(has('usb')?'':'<p><button onclick="add(\'usb\');show(\'box\')">Взять USB</button></p>');break;
}open(title,body)}
function unlock(){let code=document.getElementById('code')?.value;if(code==='1408'){state.opened=true;add('memo');open('Сейф открыт','Ты нашла секретный приказ директора: «Отключить камеры в 23:47. Протокол 07 засекречен».')}else{toast('Неверный код. Ищи подсказки на предметах.');playClick()}}
function show(id){inspect(id)}
function open(title,body){modal='<button class="close" onclick="closeModal()">✕</button><h2>'+title+'</h2>'+body;renderModal()}
function closeModal(){modal='';renderModal()}
function renderModal(){document.getElementById('overlay')?.remove();if(modal){let el=document.createElement('div');el.id='overlay';el.className='overlay';el.innerHTML='<div class="panel modal">'+modal+'</div>';document.body.appendChild(el)}}
function suspects(){open('Допрос подозреваемых','<p>Выбери человека. Вопросы можно вводить самостоятельно; сейчас ответы основаны на сценарных правилах. Подключение настоящей нейросети — отдельный этап.</p><div class="suspects">'+Object.keys(names).map(id=>`<button onclick="talk('${id}')"><img src="${id}.jpg"><b>${names[id]}</b></button>`).join('')+'</div>')}
const replies={
director:[['камера|отключ|свет','Камеры отключились автоматически. Я не отдавал такого распоряжения.'],['23:47|где|время','Я был в кабинете и никого не видел.'],['приказ|документ|подпис','Этот приказ вырван из контекста. Не делайте поспешных выводов.'],['учен|исчез|проект','Учёный хотел раскрыть данные проекта. Я пытался его остановить, но не причинял вреда.']],
scientist:[['23:47|где|время','Я работала у лабораторного терминала. Система внезапно перестала отвечать.'],['директор|соколов','Директор требовал скрыть результаты испытаний. Мы спорили из-за этого.'],['учен|исчез|проект','Учёный обнаружил нарушение протокола безопасности. Он собирался передать данные комиссии.'],['камера|отключ','У меня нет прав отключать камеры. Посмотрите журнал доступа.']],
engineer:[['23:47|где|время','Я проверял резервный канал связи. В 23:47 увидел удалённое подключение.'],['камера|отключ','Камеры отключили командой администратора. Это не обычная неисправность.'],['usb|флеш|накоп','USB принадлежит отделу безопасности. Кто-то использовал его для удаления архива.'],['директор|соколов','Я видел директора возле серверной раньше вечером. Но это ещё не доказательство.']]};
function answer(id,q){let v=q.toLowerCase();let row=replies[id].find(([pat])=>new RegExp(pat).test(v));return row?row[1]:'Я могу рассказать только то, что знаю об исчезновении. Уточните, о каком времени, человеке или доказательстве вы спрашиваете.'}
function talk(id){state.current=id;state.dialog[id]??=[];let hist=state.dialog[id].map(x=>`<div class="msg"><b>Детектив:</b> ${esc(x[0])}<br><b>${names[id].split(' — ')[0]}:</b> ${esc(x[1])}</div>`).join('');open('Допрос: '+names[id],`<img class="portrait" src="${id}.jpg"><p>Задавай свои вопросы. Сравнивай показания с уликами.</p><div class="chat" id="chat">${hist||'Допрос начат. Задай первый вопрос.'}</div><div class="inputrow"><input id="question" placeholder="Например: Где вы были в 23:47?" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Спросить</button></div><p class="hint">Демонстрационные сценарные ответы; не настоящая нейросеть.</p>`)}
function ask(){let input=document.getElementById('question'),q=input?.value.trim();if(!q)return;let id=state.current,a=answer(id,q);state.dialog[id].push([q,a]);state.questions++;talk(id);let chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight}
function journal(){open('Журнал детектива',`<p>Найдено доказательств: ${state.items.length} из ${Object.keys(ev).length}.</p><div class="items">${state.items.map(i=>'📁 '+ev[i]).join('<br>')||'Пока нет доказательств.'}</div><p>Допросов: ${state.questions}. Сопоставляй документы и показания самостоятельно.</p>`)}
function accuse(){if(state.items.length<4){toast('Для финального обвинения нужно найти хотя бы четыре улики');return}open('Финальное обвинение',`<p>Внимание: <b>обвинение можно сделать только один раз.</b> Ошибка завершит расследование, и придётся начать заново.</p><p>Кого обвиняешь?</p><select id="who" style="width:100%;padding:12px;background:#091522;color:white">${Object.keys(names).map(id=>`<option value="${id}">${names[id]}</option>`).join('')}</select><p>Выбери два доказательства:</p><div class="evidence">${state.items.map(i=>`<label><input type="checkbox" name="proof" value="${i}"> ${ev[i]}</label>`).join('')}</div><p><button class="gold" onclick="finish()">Выдвинуть обвинение</button></p>`)}
function finish(){let who=document.getElementById('who').value,proof=[...document.querySelectorAll('[name=proof]:checked')].map(x=>x.value);if(proof.length!==2){toast('Выбери ровно два доказательства');return}state.ended=true;state.screen=(who==='director'&&proof.includes('memo')&&proof.includes('log'))?'win':'lose';modal='';render()}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
if(state.screen==='home'){app.innerHTML=`<header><b>◈ ПРОТОКОЛ 07</b><span class="muted">Интерактивный детектив · демонстрационная версия</span></header><section class="hero"><div><div class="muted">23:47 · Исследовательский центр</div><h1>Дело №07<br>Тёмный протокол</h1><p>Учёный исчез. Камеры отключились. Трое подозреваемых скрывают правду. Исследуй комнаты, найди улики и реши, кому можно верить.</p><button class="gold" onclick="start()">НАЧАТЬ РАССЛЕДОВАНИЕ →</button> <button onclick="toggleMusic()">♫ Музыка вкл/выкл</button><p class="hint">Движение: WASD / стрелки / экранные кнопки. Подойди к предмету и нажми на него.</p></div></section>`;return}
if(state.screen==='win'||state.screen==='lose'){let win=state.screen==='win';app.innerHTML=`<div class="hero" style="background-image:linear-gradient(90deg,#060d19ed,#060d1977),url('${win?'lab':'server'}.jpg')"><div class="panel end"><h1>${win?'ДЕЛО РАСКРЫТО':'ДЕЛО ПРОВАЛЕНО'}</h1><p>${win?'Директор распорядился скрыть результаты эксперимента и отключить камеры. Журнал доступа и секретный приказ подтвердили его причастность к исчезновению. Учёный обнаружен живым в закрытом техническом отсеке.':'Ты обвинила не того человека или выбрала недостаточные доказательства. Настоящий виновник остаётся на свободе. Попытка завершена.'}</p><button class="gold" onclick="reset()">НАЧАТЬ ЗАНОВО</button></div></div>`;return}
let r=rooms[state.room];app.innerHTML=`<header><b>◈ ДЕЛО №07</b><span class="muted">23:47 · ${r.name}</span><button onclick="toggleMusic()">♫ Звук</button></header><div class="layout"><main><div class="stage" id="stage"><img src="${r.img}"><div class="sceneinfo">${r.name}<div class="hint">Подойди к предмету и нажми</div></div>${r.objects.map(o=>`<button class="hot" style="left:${o[1]}%;top:${o[2]}%" onclick="interact('${o[3]}')">⌕ ${o[0]}</button>`).join('')}<div class="actor" style="left:${state.x}%;top:${state.y}%"></div></div><div class="bar">${Object.keys(rooms).map(id=>`<button onclick="room('${id}')">${rooms[id].name}</button>`).join('')}</div><div class="bar"><button onclick="suspects()">👤 Допросы</button><button onclick="journal()">📁 Журнал / инвентарь</button><button class="gold" onclick="accuse()">⚖ Обвинить</button></div></main><aside class="sidebar"><div class="panel"><b>Управление</b><div class="controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="hint">WASD или стрелки; на телефоне удерживай кнопки</div></div><div class="panel"><b>Дело</b><div class="items">Улики: ${state.items.length}/8<br>Вопросы: ${state.questions}<br>Сейф: ${state.opened?'открыт':'закрыт'}</div><hr><div class="hint">Найди секретный приказ и журнал доступа, чтобы подтвердить обвинение. Не все найденные предметы полезны.</div></div></aside></div>`;
document.querySelectorAll('[data-dir]').forEach(b=>{let timer,dir=b.dataset.dir;let fn=()=>move(dir==='left'?-2.5:dir==='right'?2.5:0,dir==='up'?-2.5:dir==='down'?2.5:0);b.addEventListener('pointerdown',e=>{e.preventDefault();fn();timer=setInterval(fn,65)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});
renderModal()}
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;let m={ArrowUp:[0,-3],w:[0,-3],ArrowDown:[0,3],s:[0,3],ArrowLeft:[-3,0],a:[-3,0],ArrowRight:[3,0],d:[3,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}if(e.key==='Escape')closeModal()});
reset();
</script></body></html>
